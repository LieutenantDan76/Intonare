workflows:
  ios-testflight:
    name: Intonare iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Intonare ASC Key

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lieutenantdan.intonare
      vars:
        BUNDLE_ID: "com.lieutenantdan.intonare"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6790028334
      node: 22
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:

      - name: Install npm dependencies
        script: |
          npm install

      - name: Build www from single-file source
        script: |
          set -e

          # Mirrors go.bat steps 3, 4a and 4g. Any change to how go.bat
          # assembles the web root must be reflected here, or the iOS build
          # silently ships a different app to the Android one.

          rm -rf www
          mkdir -p www

          # go.bat [3] - the single-file app becomes the web root index.
          cp Intonare.html www/index.html

          # go.bat [4a] - Vite compiles main.js into www/main.iife.js, the
          # Capacitor haptics bridge. Without it haptics die silently, with no
          # error anywhere. vite.config.js sets emptyOutDir:false, so this does
          # not wipe the index.html copied above.
          npm run build

          # go.bat [4g] - audio samples. The app fetches from /audio/<name>/
          # but they live in audio_assets/<name>/ in the repo, so the folder is
          # renamed on the way in. Without this, every sampled instrument
          # falls back to synth.
          if [ -d audio_assets ]; then
            mkdir -p www/audio
            cp -r audio_assets/* www/audio/
          else
            echo "FATAL: audio_assets/ not found; samples would fall back to synth"
            exit 1
          fi

          [ -f manifest.json ] && cp manifest.json www/ || true

          echo "--- www contents ---"
          ls -la www/
          echo "--- audio folders ---"
          ls -la www/audio/ || true

          # main.iife.js fails silently when missing. Fail loudly instead.
          if [ ! -f www/main.iife.js ]; then
            echo "FATAL: npm run build did not produce www/main.iife.js"
            exit 1
          fi

      - name: Generate iOS platform
        script: |
          set -e

          # ios/ is NOT committed. Regenerated every build.
          # All customisation happens in the patch step below.
          rm -rf ios
          npx cap add ios

          # Capacitor 8 uses Swift Package Manager, not CocoaPods. There is no
          # Podfile and no .xcworkspace; the .xcodeproj is built directly.
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "FATAL: cap add ios did not generate ios/App/App.xcodeproj"
            exit 1
          fi

      - name: Patch Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          PB="/usr/libexec/PlistBuddy"

          # Microphone permission. Without this, iOS terminates the app the
          # instant getUserMedia fires. Not a denial; an immediate crash.
          $PB -c "Delete :NSMicrophoneUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSMicrophoneUsageDescription string 'Intonare uses the microphone to detect the pitch of your instrument or voice for tuning and ear-training exercises. Audio is processed on your device and never recorded or transmitted.'" "$PLIST"

          # Background audio, so the metronome and drones survive a screen lock.
          $PB -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          $PB -c "Add :UIBackgroundModes array" "$PLIST"
          $PB -c "Add :UIBackgroundModes:0 string audio" "$PLIST"

          # Portrait only, matching the Android build.
          $PB -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          $PB -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          $PB -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"

          # Export compliance. Intonare implements no encryption of its own;
          # HTTPS via the system stack is exempt. Declaring this here stops
          # App Store Connect asking on every single upload.
          $PB -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

          echo "--- Info.plist after patch ---"
          $PB -c "Print" "$PLIST"

      - name: Set iOS app icon
        script: |
          set -e

          # cap add ios writes a placeholder AppIcon.appiconset fresh every
          # build, so the icon is injected here rather than committed. Xcode
          # takes a single 1024x1024 and derives every other size.
          #
          # Apple rejects any alpha channel in an app icon at UPLOAD time, not
          # at review. ios_icon/AppIcon-1024.png must be flat RGB.
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"

          if [ ! -f ios_icon/AppIcon-1024.png ]; then
            echo "FATAL: ios_icon/AppIcon-1024.png not found"
            exit 1
          fi

          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          cp ios_icon/AppIcon-1024.png "$ICONSET/AppIcon-1024.png"

          printf '%s\n' \
            '{' \
            '  "images" : [' \
            '    {' \
            '      "filename" : "AppIcon-1024.png",' \
            '      "idiom" : "universal",' \
            '      "platform" : "ios",' \
            '      "size" : "1024x1024"' \
            '    }' \
            '  ],' \
            '  "info" : { "author" : "xcode", "version" : 1 }' \
            '}' > "$ICONSET/Contents.json"

          echo "--- appiconset ---"
          ls -la "$ICONSET"
          cat "$ICONSET/Contents.json"

      - name: Patch AppDelegate for audio session
        script: |
          set -e
          # Routes audio to the loudspeaker instead of the earpiece. Without
          # this, everything the app plays goes quiet the moment getUserMedia
          # flips iOS into the playAndRecord category. See the script header
          # and native_src/ios/IntonareAudioSession.swift for the full why.
          python3 patch_ios_appdelegate.py

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Set version and build number
        script: |
          set -e

          # MARKETING_VERSION is what TestFlight and the App Store display. The
          # Xcode project is regenerated every build, so it always comes back as
          # "1.0". The real version lives in Intonare.html; read it from there so
          # the two cannot drift.
          APP_VERSION=$(grep -m1 "INTONARE_VERSION:" Intonare.html \
            | sed -E 's/.*INTONARE_VERSION: *([0-9.]+).*/\1/')

          if [ -z "$APP_VERSION" ]; then
            echo "FATAL: could not read INTONARE_VERSION from Intonare.html"
            exit 1
          fi

          echo "Version from Intonare.html:  $APP_VERSION"

          # The version is DECLARED in exactly two places: the HTML comment near
          # the top and the JS const. (It is also USED once, to render the version
          # on screen; that line carries no literal and must not be checked.)
          # Confirm the two declarations agree, since a half-applied bump is easy
          # to do and invisible until someone reports the wrong version.
          COMMENT_VER=$(grep -m1 -oE "INTONARE_VERSION: *[0-9.]+" Intonare.html \
            | grep -oE "[0-9.]+$")
          CONST_VER=$(grep -m1 -oE "const INTONARE_VERSION *= *'[0-9.]+'" Intonare.html \
            | grep -oE "[0-9.]+")

          if [ "$COMMENT_VER" != "$CONST_VER" ]; then
            echo "FATAL: the two version declarations in Intonare.html disagree."
            echo "  HTML comment: $COMMENT_VER"
            echo "  JS const:     $CONST_VER"
            echo "A version bump was only half applied."
            exit 1
          fi

          # The newest CHANGELOG.md entry must be for this version. If it is not,
          # either the changelog was not written or the version was not bumped;
          # either way something shipped without a record.
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_VERSION=$(grep -m1 -E "^## v[0-9]" CHANGELOG.md \
              | sed -E 's/^## v([0-9.]+).*/\1/')
            echo "Version from CHANGELOG.md:   $CHANGELOG_VERSION"

            if [ "$APP_VERSION" != "$CHANGELOG_VERSION" ]; then
              echo ""
              echo "FATAL: version drift."
              echo "  Intonare.html says: $APP_VERSION"
              echo "  CHANGELOG.md says:  $CHANGELOG_VERSION"
              echo ""
              echo "Either the changelog entry for $APP_VERSION was never written,"
              echo "or the version in Intonare.html was never bumped. Fix whichever"
              echo "it is; do not ship a build with no record of what changed."
              exit 1
            fi
          else
            echo "WARNING: no CHANGELOG.md; skipping the version drift check."
          fi

          cd ios/App

          # CFBundleShortVersionString - the human-facing version.
          agvtool new-marketing-version "$APP_VERSION"

          # CFBundleVersion - what TestFlight shows in parentheses. Must be unique
          # per marketing version.
          #
          # This used to read the latest build number back from TestFlight and add
          # one. That query is scoped PER MARKETING VERSION, so every time the
          # version string changed the count restarted and every build came out as
          # (4): 0.81.1 (4), 0.81.2 (4), 0.81.3 (4). Legal, since Apple only needs
          # uniqueness within a version, but useless for telling builds apart.
          #
          # $BUILD_NUMBER is Codemagic's own counter for this workflow. It only
          # ever increases, it does not care about the marketing version, and it
          # needs no API call that can fail quietly and fall back to a constant.
          agvtool new-version -all "$BUILD_NUMBER"
          echo "--- versions set ---"
          agvtool what-marketing-version
          agvtool what-version

      - name: Set up code signing
        script: |
          set -e
          # The ios_signing block has already fetched the certificate and
          # provisioning profile into the keychain. This just writes the
          # signing settings into the Xcode project.
          # testFlightInternalTestingOnly keeps this build out of Apple's Beta
          # App Review queue. Internal testers only; cannot be promoted to
          # external testing later. That is what we want while _iosBetaUnlock()
          # is still granting Pro without StoreKit.
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # submit_to_testflight is deliberately NOT set. It submits the build to
        # Apple's Beta App Review queue, which is only needed for external
        # testers. The build still uploads and appears in TestFlight for
        # internal testers without it, and internal testing needs no review.
        # Turn it on only once _iosBetaUnlock() is gone and StoreKit IAP is
        # wired, since a Pro unlock with no purchase path fails Guideline 3.1.1.

      email:
        recipients:
          - intonare.dev@gmail.com
        notify:
          success: true
          failure: true
