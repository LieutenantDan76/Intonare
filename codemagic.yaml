workflows:
  ios-testflight:
    name: Intonare iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Intonare ASC Key

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lieutenantdan.intonare
      vars:
        BUNDLE_ID: "com.lieutenantdan.intonare"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6790028334
      node: 22
      xcode: latest

    # AUTOMATIC BUILDS ARE OFF.
    #
    # There is no `triggering:` block, so a git push does NOT start a build. Use "Start
    # new build" in Codemagic when you actually want an IPA.
    #
    # Why: most pushes are web-code changes to Intonare.html, which are tested on
    # Android (or the browser) without needing a native iOS build at all. Building an
    # IPA for each of those burns credits for nothing.
    #
    # TO TURN AUTOMATIC BUILDS BACK ON, put this back above `scripts:`:
    #
    #   triggering:
    #     events:
    #       - push
    #     branch_patterns:
    #       - pattern: main
    #         include: true
    #         source: true
    #
    # Note that NATIVE changes still need a build to reach a device: anything touching
    # the entitlements, Info.plist, the Swift plugin, or the URL scheme only takes
    # effect in a fresh IPA. Push alone will not do it.

    scripts:

      - name: Install npm dependencies
        script: |
          npm install

      - name: Build www from single-file source
        script: |
          set -e

          # Mirrors go.bat steps 3, 4a and 4g. Any change to how go.bat
          # assembles the web root must be reflected here, or the iOS build
          # silently ships a different app to the Android one.

          rm -rf www
          mkdir -p www

          # go.bat [3] - the single-file app becomes the web root index.
          cp Intonare.html www/index.html

          # go.bat [4a] - Vite compiles main.js into www/main.iife.js, the
          # Capacitor haptics bridge. Without it haptics die silently, with no
          # error anywhere. vite.config.js sets emptyOutDir:false, so this does
          # not wipe the index.html copied above.
          npm run build

          # go.bat [4g] - audio samples. The app fetches from /audio/<name>/
          # but they live in audio_assets/<name>/ in the repo, so the folder is
          # renamed on the way in. Without this, every sampled instrument
          # falls back to synth.
          if [ -d audio_assets ]; then
            mkdir -p www/audio
            cp -r audio_assets/* www/audio/
          else
            echo "FATAL: audio_assets/ not found; samples would fall back to synth"
            exit 1
          fi

          [ -f manifest.json ] && cp manifest.json www/ || true

          echo "--- www contents ---"
          ls -la www/
          echo "--- audio folders ---"
          ls -la www/audio/ || true

          # The launch sound, for iOS.
          #
          # The Android source is Vorbis (.ogg), which iOS cannot decode at all.
          # Transcode to AAC and drop it in www/audio/, which Capacitor copies into
          # the bundle as public/audio/ — a folder that is ALREADY a registered
          # Xcode resource (it is how the whole app loads). So the sound ships with
          # no pbxproj surgery, which matters because `cap add ios` regenerates the
          # project file every build.
          SPLASH_SRC="native_src/res/raw/intonare_splash.ogg"
          if [ ! -f "$SPLASH_SRC" ]; then
            echo "FATAL: $SPLASH_SRC not found; the iOS launch sound would be silent."
            exit 1
          fi

          # ffmpeg is usually present on Codemagic's macOS images, but "usually" is
          # not a build guarantee. Install it if it is missing rather than failing.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg not found; installing via Homebrew."
            brew install ffmpeg
          fi

          ffmpeg -v error -y -i "$SPLASH_SRC" -c:a aac -b:a 128k www/audio/intonare_splash.m4a
          echo "splash sound transcoded:"
          ls -la www/audio/intonare_splash.m4a

          # main.iife.js fails silently when missing. Fail loudly instead.
          if [ ! -f www/main.iife.js ]; then
            echo "FATAL: npm run build did not produce www/main.iife.js"
            exit 1
          fi

      - name: Clean capacitor.config.json of invalid iosScheme
        script: |
          set -e

          # A previous fix attempt set server.iosScheme to "https". That value is
          # invalid — Capacitor's docs on iosScheme: "Can't be set to schemes that
          # the WKWebView already handles, such as http or https" — and it is
          # silently ignored rather than rejected. Remove it if present so it does
          # not sit in the config looking intentional.
          #
          # The actual fix for fetch() failing against capacitor://localhost is in
          # the app itself: _fetchBuffer falls back to XMLHttpRequest, which goes
          # through WKWebView's ordinary resource-loading path (the same one
          # <script> tags use) and CAN read the custom scheme.

          if [ ! -f capacitor.config.json ]; then
            echo "FATAL: capacitor.config.json not found at repo root."
            exit 1
          fi

          python3 -c "
          import json
          cfg = json.load(open('capacitor.config.json'))
          srv = cfg.get('server', {})
          if srv.get('iosScheme') in ('https', 'http'):
              print('removing invalid server.iosScheme: %r' % srv['iosScheme'])
              del srv['iosScheme']
              if not srv:
                  cfg.pop('server', None)
              json.dump(cfg, open('capacitor.config.json', 'w'), indent=2)
          else:
              print('config clean; nothing to do')
          "

      - name: Generate iOS platform
        script: |
          set -e

          # ios/ is NOT committed. Regenerated every build.
          # All customisation happens in the patch step below.
          rm -rf ios
          npx cap add ios

          # Capacitor 8 uses Swift Package Manager, not CocoaPods. There is no
          # Podfile and no .xcworkspace; the .xcodeproj is built directly.
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "FATAL: cap add ios did not generate ios/App/App.xcodeproj"
            exit 1
          fi

      - name: Patch Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          PB="/usr/libexec/PlistBuddy"

          # Microphone permission. Without this, iOS terminates the app the
          # instant getUserMedia fires. Not a denial; an immediate crash.
          $PB -c "Delete :NSMicrophoneUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSMicrophoneUsageDescription string 'Intonare uses the microphone to detect the pitch of your instrument or voice for tuning and ear-training exercises. Audio is processed on your device and never recorded or transmitted.'" "$PLIST"

          # Background audio, so the metronome and drones survive a screen lock.
          $PB -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          $PB -c "Add :UIBackgroundModes array" "$PLIST"
          $PB -c "Add :UIBackgroundModes:0 string audio" "$PLIST"

          # Portrait only, matching the Android build.
          $PB -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          $PB -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          $PB -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"

          # Declared localizations. Without this, iOS will not even look for a
          # localized string file — the plist value is used verbatim regardless of
          # device language.
          $PB -c "Delete :CFBundleLocalizations" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleLocalizations array" "$PLIST"
          $PB -c "Add :CFBundleLocalizations:0 string en" "$PLIST"
          $PB -c "Add :CFBundleLocalizations:1 string it" "$PLIST"
          $PB -c "Delete :CFBundleDevelopmentRegion" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleDevelopmentRegion string en" "$PLIST"

          # Localized permission strings.
          #
          # The plist value above is the FALLBACK, used when the device language
          # has no .lproj. The Italian one lives in it.lproj/InfoPlist.strings.
          #
          # THE OPEN QUESTION: strictly, a .lproj must be registered in the Xcode
          # project as a resource to be copied into the bundle, and editing
          # project.pbxproj from a script is exactly the fragile nonsense this
          # pipeline has avoided all along. The bet here is that `cap add ios`
          # registers the App/App folder's contents, so a .lproj dropped inside it
          # gets copied without any pbxproj surgery.
          #
          # If the Italian prompt does not appear on an Italian device, that bet
          # was wrong and the .lproj is not reaching the bundle. The fix would then
          # be a pbxproj patch, or moving to an InfoPlist.xcstrings catalogue.
          for LANG in en it; do
            mkdir -p "ios/App/App/$LANG.lproj"
          done

          # Written by python, not shell: the Italian string needs a real 'ne'
          # with an acute accent, and getting a UTF-8 accented character through
          # bash quoting inside an indented YAML block is a fight not worth having.
          python3 -c "
          import io
          EN = 'Intonare uses the microphone to detect the pitch of your instrument or voice for tuning and ear-training exercises. Audio is processed on your device and never recorded or transmitted.'
          IT = 'Intonare usa il microfono per riconoscere l\u2019intonazione del tuo strumento o della tua voce, per accordare e per gli esercizi di orecchio musicale. L\u2019audio viene elaborato sul dispositivo: non viene mai registrato n\u00e9 inviato altrove.'
          for lang, txt in (('en', EN), ('it', IT)):
              path = 'ios/App/App/%s.lproj/InfoPlist.strings' % lang
              with io.open(path, 'w', encoding='utf-8') as f:
                  f.write('\"NSMicrophoneUsageDescription\" = \"%s\";\n' % txt)
              print('wrote %s' % path)
          "

          echo "--- en.lproj/InfoPlist.strings ---"
          cat "ios/App/App/en.lproj/InfoPlist.strings"
          echo "--- it.lproj/InfoPlist.strings ---"
          cat "ios/App/App/it.lproj/InfoPlist.strings"

          # Export compliance. Intonare implements no encryption of its own;
          # HTTPS via the system stack is exempt. Declaring this here stops
          # App Store Connect asking on every single upload.
          $PB -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

          # ── Deep links: register the intonare:// scheme ────────────────────
          # Shared daily results (Chordle, Tonale, Diadle) carry an https link to a
          # bounce page, which tries intonare://<module> and falls back to the store
          # if nothing intercepts it. This is the half that does the intercepting.
          #
          # Custom scheme rather than Universal Links, for now: Universal Links need
          # the Apple Team ID and a verified apple-app-site-association file served
          # from the domain, which needs the app to exist on the App Store first.
          # The shared URL is https either way, so switching to Universal Links later
          # is purely additive -- no app change, no change to any link already sent.
          $PB -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes array" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.lieutenantdan.intonare" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string intonare" "$PLIST"
          echo "  URL scheme registered: intonare://"

          # ── Universal Links: Associated Domains entitlement ─────────────────
          # iOS fetches
          #   https://lieutenantdan76.github.io/.well-known/apple-app-site-association
          # on install, sees this app listed, and thereafter OWNS the URL: a shared
          # link opens the app directly. No Safari, no bounce page, no tap.
          #
          # REQUIRES a one-off in the Apple Developer portal: Identifiers →
          # com.lieutenantdan.intonare → tick Associated Domains. Without it the
          # capability is missing from the provisioning profile and signing FAILS.
          #
          # printf, not a heredoc: heredoc body sits at column 0, which terminates the
          # YAML block scalar this script lives in and breaks the whole file.
          ENT="ios/App/App/App.entitlements"
          if [ ! -f "$ENT" ]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0">' '<dict>' '</dict>' '</plist>' > "$ENT"
          fi
          $PB -c "Delete :com.apple.developer.associated-domains" "$ENT" 2>/dev/null || true
          $PB -c "Add :com.apple.developer.associated-domains array" "$ENT"
          $PB -c "Add :com.apple.developer.associated-domains:0 string applinks:lieutenantdan76.github.io" "$ENT"
          echo "  Associated Domains entitlement:"
          cat "$ENT"

          # Xcode must be told the entitlements file exists.
          if ! grep -q "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj; then
            echo "  NOTE: CODE_SIGN_ENTITLEMENTS not in pbxproj — Capacitor 8 templates include it by default; if signing fails, that is the first thing to check."
          fi

          # NOTE: CADisableMinimumFrameDurationOnPhone is deliberately NOT set.
          #
          # It unlocks 120 Hz for NATIVE Core Animation and has ZERO effect on
          # WKWebView's rendering. Apple caps requestAnimationFrame at 60 fps inside
          # WKWebView by design, for power reasons, and there is no public API to
          # change it. The splash is a canvas rAF loop, so it runs at 60 on iOS and
          # 120 on Android, and no plist key will fix that. Verified against the
          # WebKit bug tracker and Apple's own forums after shipping the key and
          # measuring no change (still 59.4 fps).
          #
          # The only real routes to 120 in a WebView are CSS/WAAPI composited
          # animations (which are not rAF-bound) or WebKit private APIs (App Store
          # rejection). Both are out of scope here.

          echo "--- Info.plist after patch ---"
          $PB -c "Print" "$PLIST"

      - name: Set iOS app icon
        script: |
          set -e

          # cap add ios writes a placeholder AppIcon.appiconset fresh every
          # build, so the icon is injected here rather than committed. Xcode
          # takes a single 1024x1024 and derives every other size.
          #
          # Apple rejects any alpha channel in an app icon at UPLOAD time, not
          # at review. ios_icon/AppIcon-1024.png must be flat RGB.
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"

          if [ ! -f ios_icon/AppIcon-1024.png ]; then
            echo "FATAL: ios_icon/AppIcon-1024.png not found"
            exit 1
          fi

          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          cp ios_icon/AppIcon-1024.png "$ICONSET/AppIcon-1024.png"

          printf '%s\n' \
            '{' \
            '  "images" : [' \
            '    {' \
            '      "filename" : "AppIcon-1024.png",' \
            '      "idiom" : "universal",' \
            '      "platform" : "ios",' \
            '      "size" : "1024x1024"' \
            '    }' \
            '  ],' \
            '  "info" : { "author" : "xcode", "version" : 1 }' \
            '}' > "$ICONSET/Contents.json"

          echo "--- appiconset ---"
          ls -la "$ICONSET"
          cat "$ICONSET/Contents.json"

      - name: Patch AppDelegate for audio session
        script: |
          set -e
          # Routes audio to the loudspeaker instead of the earpiece. Without
          # this, everything the app plays goes quiet the moment getUserMedia
          # flips iOS into the playAndRecord category. See the script header
          # and native_src/ios/IntonareAudioSession.swift for the full why.
          python3 patch_ios_appdelegate.py

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Set version and build number
        script: |
          set -e

          # MARKETING_VERSION is what TestFlight and the App Store display. The
          # Xcode project is regenerated every build, so it always comes back as
          # "1.0". The real version lives in Intonare.html; read it from there so
          # the two cannot drift.
          APP_VERSION=$(grep -m1 "INTONARE_VERSION:" Intonare.html \
            | sed -E 's/.*INTONARE_VERSION: *([0-9.]+).*/\1/')

          if [ -z "$APP_VERSION" ]; then
            echo "FATAL: could not read INTONARE_VERSION from Intonare.html"
            exit 1
          fi

          echo "Version from Intonare.html:  $APP_VERSION"

          # The version is DECLARED in exactly two places: the HTML comment near
          # the top and the JS const. (It is also USED once, to render the version
          # on screen; that line carries no literal and must not be checked.)
          # Confirm the two declarations agree, since a half-applied bump is easy
          # to do and invisible until someone reports the wrong version.
          COMMENT_VER=$(grep -m1 -oE "INTONARE_VERSION: *[0-9.]+" Intonare.html \
            | grep -oE "[0-9.]+$")
          CONST_VER=$(grep -m1 -oE "const INTONARE_VERSION *= *'[0-9.]+'" Intonare.html \
            | grep -oE "[0-9.]+")

          if [ "$COMMENT_VER" != "$CONST_VER" ]; then
            echo "FATAL: the two version declarations in Intonare.html disagree."
            echo "  HTML comment: $COMMENT_VER"
            echo "  JS const:     $CONST_VER"
            echo "A version bump was only half applied."
            exit 1
          fi

          # The newest CHANGELOG.md entry must be for this version. If it is not,
          # either the changelog was not written or the version was not bumped;
          # either way something shipped without a record.
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_VERSION=$(grep -m1 -E "^## v[0-9]" CHANGELOG.md \
              | sed -E 's/^## v([0-9.]+).*/\1/')
            echo "Version from CHANGELOG.md:   $CHANGELOG_VERSION"

            if [ "$APP_VERSION" != "$CHANGELOG_VERSION" ]; then
              echo ""
              echo "FATAL: version drift."
              echo "  Intonare.html says: $APP_VERSION"
              echo "  CHANGELOG.md says:  $CHANGELOG_VERSION"
              echo ""
              echo "Either the changelog entry for $APP_VERSION was never written,"
              echo "or the version in Intonare.html was never bumped. Fix whichever"
              echo "it is; do not ship a build with no record of what changed."
              exit 1
            fi
          else
            echo "WARNING: no CHANGELOG.md; skipping the version drift check."
          fi

          cd ios/App

          # CFBundleShortVersionString - the human-facing version.
          agvtool new-marketing-version "$APP_VERSION"

          # CFBundleVersion - what TestFlight shows in parentheses. Must be unique
          # per marketing version.
          #
          # This used to read the latest build number back from TestFlight and add
          # one. That query is scoped PER MARKETING VERSION, so every time the
          # version string changed the count restarted and every build came out as
          # (4): 0.81.1 (4), 0.81.2 (4), 0.81.3 (4). Legal, since Apple only needs
          # uniqueness within a version, but useless for telling builds apart.
          #
          # $BUILD_NUMBER is Codemagic's own counter for this workflow. It only
          # ever increases, it does not care about the marketing version, and it
          # needs no API call that can fail quietly and fall back to a constant.
          agvtool new-version -all "$BUILD_NUMBER"
          echo "--- versions set ---"
          agvtool what-marketing-version
          agvtool what-version

      - name: Set up code signing
        script: |
          set -e
          # The ios_signing block has already fetched the certificate and
          # provisioning profile into the keychain. This just writes the
          # signing settings into the Xcode project.
          # testFlightInternalTestingOnly keeps this build out of Apple's Beta
          # App Review queue. Internal testers only; cannot be promoted to
          # external testing later. That is what we want while _iosBetaUnlock()
          # is still granting Pro without StoreKit.
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # submit_to_testflight is deliberately NOT set. It submits the build to
        # Apple's Beta App Review queue, which is only needed for external
        # testers. The build still uploads and appears in TestFlight for
        # internal testers without it, and internal testing needs no review.
        # Turn it on only once _iosBetaUnlock() is gone and StoreKit IAP is
        # wired, since a Pro unlock with no purchase path fails Guideline 3.1.1.

      email:
        recipients:
          - intonare.dev@gmail.com
        notify:
          success: true
          failure: true
