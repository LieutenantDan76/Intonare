// Clean a slot's traced geometry: drop tiny degenerate "speck" subpaths the trace
// left behind (stray slivers with near-zero area), and strip slot 13's phantom ring
// that coincides with the RH3 hole (an artifact of the two keys overlapping in the
// source chart). RH3 is drawn as its own clean circle.
function _fluteCleanD(slot, d){
  if (!d) return d;
  const subs = d.split(/(?=M )/).filter(s => s.trim());
  const kept = subs.filter(s => {
    const n = (s.match(/-?[\d.]+/g) || []).map(Number);
    if (n.length < 4) return false;   // not enough points to be a real shape
    const xs = n.filter((_,i)=>i%2===0), ys = n.filter((_,i)=>i%2===1);
    const cx = (Math.min(...xs)+Math.max(...xs))/2, cy = (Math.min(...ys)+Math.max(...ys))/2;
    const w = Math.max(...xs)-Math.min(...xs), h = Math.max(...ys)-Math.min(...ys);
    if (w * h < 3) return false;       // tiny degenerate sliver/speck → drop
    if (slot === 13){
      const isRHRing = Math.abs(cx-246) < 4 && Math.abs(cy-47) < 4 && Math.abs(w-h) < 4;
      if (isRHRing) return false;
    }
    return true;
  });
  // If every subpath was a degenerate sliver (e.g. slot 0's broken trace fragment),
  // return empty so nothing is drawn — that stray fragment was the "dot" artifact.
  return kept.join('');
}
// Kept for reference / other logic. (No longer used for fill since circles fill natively.)
// The fill body for a closed key: the OUTER subpath only (largest bounding box). These
// keys are traced as double-line shapes (outer edge + inner edge); filling the full
// path would let the inner edge carve a hole, leaving an outline-looking gap. Taking
// just the outer boundary fills the whole shape solid. Painted under the crisp outline.
const _fluteFillBody = {};
function _fluteGetFillBody(slot, d) {
  if (slot in _fluteFillBody) return _fluteFillBody[slot];
  const subs = d.split(/(?=M )/).filter(s => s.trim());
  let body = d;
  if (subs.length > 1) {
    let best = -1;
    for (const s of subs) {
      const n = (s.match(/-?[\d.]+/g) || []).map(Number);
      if (n.length < 4) continue;
      const xs = n.filter((_, i) => i % 2 === 0), ys = n.filter((_, i) => i % 2 === 1);
      const area = (Math.max(...xs) - Math.min(...xs)) * (Math.max(...ys) - Math.min(...ys));
      if (area > best) { best = area; body = s; }
    }
  }
  _fluteFillBody[slot] = body;
  return body;
}

// Style a real <circle> tone-hole: closed = solid green disc, open = hollow gray ring.
// Smooth by construction, so no aliasing and no separate fill element needed.
function _fluteStyleCircle(c, isClosed) {
  const ON='var(--diagacc)';
  const L_OFF='#8a99a6';
  if (isClosed){
    c.setAttribute('fill', ON); c.setAttribute('stroke', ON); c.setAttribute('stroke-width','0.7');
  } else {
    c.setAttribute('fill','none'); c.setAttribute('stroke', L_OFF); c.setAttribute('stroke-width','1.6');
  }
}

// Style a slot's OUTLINE path. This NEVER swaps geometry and NEVER fattens strokes —
// every shape keeps its exact traced outline at its original weight, so nothing
// aliases or looks low-res. Closed = green outline (+ a fill added separately for
// rings/solids), open = gray outline. The center fill for closed holes is a separate
// element drawn in _fluteSvgDraw, so it can't disturb this crisp outline.
function _fluteStyleSlotPath(p, slot, isClosed, fullD) {
  const ON='var(--diagacc)';
  const L_OFF='#8a99a6';   // open: opaque neutral gray (no alpha → no green bleed)
  const SW_OPEN=1.3, SW_CLOSED=0.7;
  if (fullD) p.setAttribute('d', fullD);
  p.setAttribute('fill-rule','evenodd');
  // Outline only — the solid fill (when closed) comes from a separate body element in
  // _fluteSvgDraw, so the crisp traced outline is never disturbed. Closed = green
  // outline over a green body (reads solid); open = gray outline (reads hollow).
  p.setAttribute('fill','none');
  p.setAttribute('stroke', isClosed ? ON : L_OFF);
  p.setAttribute('stroke-width', String(isClosed ? SW_CLOSED : SW_OPEN));
  p.setAttribute('stroke-linejoin','round');
}
